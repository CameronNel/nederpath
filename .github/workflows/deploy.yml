name: Deploy NederPath to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    name: Validate Quality & Artifact Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Migrate lexical merge policy
        run: node scripts/migrate_lexical_merge_policy.mjs

      - name: Regenerate lexical artifact
        run: npm run words

      - name: Persist regenerated lexical data
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lexical_merge_policy.json data/words.js data/word_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: synchronize lexical generated artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run Lexical Gold-Standard Checks
        run: |
          node scripts/lexical_audit.mjs --strict
          node tests/lexical.mjs
          node scripts/verify_lexical_independent.mjs

      - name: Run Quality Audit, Smoke, Regression, and Browser Tests
        run: npm test

      - name: Build Production Artifact
        run: npm run build

      - name: Audit Build Artifact
        run: npm run audit:artifact

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Pages with Enablement
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
