name: Deploy NederPath to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  validate:
    name: Validate Quality & Artifact Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Regenerate lexical artifact
        run: npm run words

      - name: Verify generated lexical artifact is committed
        run: git diff --exit-code -- data/words.js data/word_ids.json

      - name: Run Lexical Gold-Standard Checks
        run: |
          node scripts/lexical_audit.mjs --strict
          node tests/lexical.mjs
          node tests/lexical_orthography.mjs
          node scripts/build_lexical_review_ledger.mjs
          node scripts/review_lexical_merges.mjs
          node tests/lexical_review_ledger.mjs
          node scripts/validate_lexical_semantic_review.mjs --strict
          node scripts/verify_lexical_independent.mjs

      - name: Run Quality Audit, Smoke, Regression, and Browser Tests
        run: npm test

      - name: Build Production Artifact
        run: npm run build

      - name: Audit Build Artifact
        run: npm run audit:artifact

      - name: Residue and native payload audit
        run: |
          node scripts/audit-replatform-residue.mjs
          node mobile/scripts/prepare-web.mjs
          node scripts/audit-mobile-package.mjs

  android:
    name: Android debug assemble
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare native web payload
        working-directory: mobile
        run: |
          npm ci
          node scripts/prepare-web.mjs
          npx cap sync android

      - name: Assemble unsigned debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Setup Pages with Enablement
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
