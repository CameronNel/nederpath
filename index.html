<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NederPath - A calm, comprehensive, offline-first Dutch language learning web application covering Vocabulary, Grammar, and Comprehension." />
  <meta name="theme-color" content="#121820" />
  <title>NederPath - Nederlands Leren & Meesterschap</title>

  <!-- Web App Manifest & Icons -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <a href="#" class="brand" id="brand-link">
        <img src="./icons/favicon-32.png" alt="NederPath" class="brand-icon" />
        <span class="brand-title">NederPath</span>
      </a>

      <!-- Primary Navigation -->
      <nav class="main-nav" aria-label="Main Navigation">
        <button class="nav-btn active" data-tab="today" id="nav-today">
          <span class="nav-icon">📅</span> Vandaag
        </button>
        <button class="nav-btn" data-tab="path" id="nav-path">
          <span class="nav-icon">🗺️</span> Pad
        </button>
        <button class="nav-btn" data-tab="practice" id="nav-practice">
          <span class="nav-icon">⚡</span> Oefenen
        </button>
        <button class="nav-btn" data-tab="words" id="nav-words">
          <span class="nav-icon">📖</span> Woorden
        </button>
        <button class="nav-btn" data-tab="progress" id="nav-progress">
          <span class="nav-icon">📊</span> Voortgang
        </button>
      </nav>

      <!-- Header Quick Stats -->
      <div class="header-stats">
        <div class="stat-pill-sm" title="Huidige dagelijkse streak">
          <span>🔥</span> <span id="header-streak">0</span>
        </div>
        <div class="stat-pill-sm" title="Totaal verdiende XP">
          <span>🏆</span> <span id="header-xp">0 XP</span>
        </div>
        <div class="stat-pill-sm" title="Vandaag geleerd / Dagdoel">
          <span>🎯</span> <span id="header-goal">0/15</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-main" class="app-main" role="main">
    <div class="card empty-state">NederPath wordt geladen...</div>
  </main>

  <!-- App Data Scripts -->
  <script src="./data/words.js"></script>
  <script src="./data/grammar.js"></script>
  <script src="./data/sentences.js"></script>
  <script src="./data/idioms.js"></script>
  <script src="./data/comprehension.js"></script>

  <!-- App Core Runtime -->
  <script src="./js/store.js"></script>
  <script src="./js/srs.js"></script>
  <script src="./js/voice.js"></script>
  <script src="./js/app.js"></script>

  <!-- Service Worker Registration for Offline/PWA support -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").then(
          (reg) => console.log("NederPath ServiceWorker registered:", reg.scope),
          (err) => console.warn("NederPath ServiceWorker registration failed:", err)
        );
      });
    }
  </script>
</body>
</html>
